name: media_editor
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

repository: https://github.com/ThanCoder/media_editor.git

environment:
  sdk: ^3.12.0
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  ffmpeg_kit_extended_flutter: ^0.6.0
  than_pkg_linux: ^0.2.0
  cfb_store: ^0.7.0
  dart_core_extensions: ^0.5.0
  t_widgets:
    path: /home/thancoder/projects/dart_plugins/t_widgets
  than_pkg_android: ^0.6.1
  file_picker: ^12.0.0
  desktop_drop: ^0.8.0
  file_type_plus: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg


ffmpeg_kit_extended_config:
  type: "video" # pre-bundled builds: debug, base, full, audio, video, video_hw
  gpl: false # enable to include GPL libraries. x
  small: true # enable to use smaller builds
  # == OR ==
  # -------------------------------------------------------------
  # You can specify remote or local path to libffmpegkit libraries for each platform
  # This allows you to deploy custom builds of libffmpegkit.
  # See: https://github.com/akashskypatel/ffmpeg-kit-builders
  # Example:
  # windows: "path/to/ffmpeg-kit/libraries"
  # ios: "https://path/to/bundle.xcframework.zip"
  android: /home/thancoder/Downloads/ffmpeg_kit_extended_flutter/0.11.0/android/bundle-base-shared-small-lgpl-release.aar
  linux: /home/thancoder/Downloads/ffmpeg_kit_extended_flutter/0.11.0/linux/bundle-base-linux-x86_64-shared-small-gpl.zip

