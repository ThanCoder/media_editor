name: media_editor
description: "ffmpeg command editor"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 0.1.0

repository: https://github.com/ThanCoder/media_editor.git

environment:
  sdk: ^3.14.0
dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.11.0

  cupertino_icons: ^2.0.0
  than_pkg_linux: ^0.3.0
  cfb_store: ^0.8.0
  dart_core_extensions: ^0.9.0
  file_picker: ^13.3.3
  file_type_plus: ^1.1.0
  package_info_plus: ^10.2.1
  path_provider: ^2.1.6
  uuid: ^4.6.0
  url_launcher: ^6.3.2

  than_pkg_android:
    git: https://github.com/ThanCoder/than_pkg_android.git
  t_client:
    git: https://github.com/ThanCoder/t_client.git
  ffmpeg_bin: ^0.2.0
  # ffmpeg_bin:
  #   git: https://github.com/ThanCoder/ffmpeg_bin.git
  # flutter pub upgrade --major-versions

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  change_app_package_name: ^1.5.0
  # dart run change_app_package_name:main [com.new.package.name]
  # dart run change_app_package_name:main than.app.ffmpeg.editor
  flutter_launcher_icons: ^0.14.4
  # dart run flutter_launcher_icons

  # dev lib
flutter_launcher_icons:
  android: "launcher_icon"
  image_path: "assets/logo/ffmpeg_editor.png"
flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
  - assets/logo/
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

