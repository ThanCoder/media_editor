  # ios: "https://path/to/bundle.xcframework.zip"
  android: /home/thancoder/Downloads/ffmpeg-kit-builders/0.11.1/bundle-base-shared-gpl-release.aar
  linux: /home/thancoder/Downloads/ffmpeg-kit-builders/0.11.1/bundle-base-linux-x86_64-shared-gpl.zip
